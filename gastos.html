<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Gastos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Registro de Gastos Fijos y Operativos</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold overflow-x-auto">
      <a href="index.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 px-2 rounded-lg bg-white shadow text-slate-900 font-bold whitespace-nowrap">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="caja.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cash-register"></i> Caja
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Registrar Gasto -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 border-b pb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-receipt text-rose-500"></i> Registrar Nuevo Gasto
      </h3>

      <div class="space-y-2">
        <div>
          <label class="block text-[11px] font-medium text-gray-600">Descripción o Concepto</label>
          <input type="text" id="gasto-concepto" placeholder="Ej. Pago de luz, transporte, bolsas" class="w-full border rounded-xl p-2 text-xs outline-none focus:ring-1 focus:ring-rose-500">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-gray-600">Monto ($)</label>
          <input type="number" step="0.01" id="gasto-monto" placeholder="0.00" class="w-full border rounded-xl p-2 text-xs outline-none focus:ring-1 focus:ring-rose-500">
        </div>
      </div>

      <button onclick="guardarGasto()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-plus"></i> Guardar Gasto
      </button>
    </div>

    <!-- Historial de Gastos -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 border-b pb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-clock-rotate-left text-slate-600"></i> Lista de Gastos Registrados
      </h3>
      <div id="lista-gastos" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function renderListaGastos() {
      const contenedor = document.getElementById('lista-gastos');
      if (!contenedor) return;
      const gastos = window.gastos || [];

      if (gastos.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No hay gastos registrados.</p>';
        return;
      }

      contenedor.innerHTML = '';
      gastos.forEach(g => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-gray-50 rounded-xl border flex justify-between items-center text-xs';
        const fecha = new Date(g.fecha || g.created_at || Date.now()).toLocaleDateString();

        item.innerHTML = `
          <div>
            <p class="font-bold text-slate-800">${g.concepto || g.descripcion || 'Gasto'}</p>
            <p class="text-[10px] text-gray-400">${fecha}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-rose-600 text-sm">-$${Number(g.monto || g.precio || 0).toFixed(2)}</span>
            <button onclick="eliminarGasto('${g.id}')" class="text-rose-600 hover:bg-rose-50 p-1 rounded">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        contenedor.appendChild(item);
      });
    }

    async function guardarGasto() {
      const concepto = document.getElementById('gasto-concepto').value.trim();
      const monto = parseFloat(document.getElementById('gasto-monto').value) || 0;

      if (!concepto || monto <= 0) {
        alert('Ingresa un concepto válido y un monto mayor a cero.');
        return;
      }

      const db = window._supabase || window.supabase;
      await db.from('gastos').insert([{ concepto, monto, fecha: new Date().toISOString() }]);

      document.getElementById('gasto-concepto').value = '';
      document.getElementById('gasto-monto').value = '';

      if (typeof cargarDatosGlobales === 'function') await cargarDatosGlobales();
      renderListaGastos();
    }

    async function eliminarGasto(id) {
      if (!confirm('¿Seguro que deseas eliminar este gasto?')) return;
      const db = window._supabase || window.supabase;
      await db.from('gastos').delete().eq('id', id);
      if (typeof cargarDatosGlobales === 'function') await cargarDatosGlobales();
      renderListaGastos();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') await cargarDatosGlobales();
      renderListaGastos();
    });
  </script>
</body>
</html>
