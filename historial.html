<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Historial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-receipt text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Historial de Ventas</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold">
      <a href="index.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 rounded-lg bg-white shadow text-slate-900 font-bold">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Lista Ventas -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider">Ventas Registradas</h2>
      </div>
      <div id="lista-ventas" class="space-y-1.5 max-h-96 overflow-y-auto"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function renderVentas() {
      const lista = document.getElementById('lista-ventas');
      if (!lista) return;
      lista.innerHTML = '';
      if (ventas.length === 0) {
        lista.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">No hay ventas registradas.</p>';
        return;
      }
      ventas.forEach(v => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-gray-50 rounded-xl border text-xs space-y-0.5';
        item.innerHTML = `
          <div class="flex justify-between font-bold">
            <span>${v.cantidad || 1}x ${v.producto}</span>
            <span>+$${Number(v.ingreso || 0).toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-[9px] text-gray-500">
            <span>${v.fecha || ''}</span>
            <span class="text-blue-600">Reinv: $${Number(v.reinversion || 0).toFixed(2)}</span>
            <span class="text-emerald-600 font-bold">Gan: +$${Number(v.gananciaBruta || 0).toFixed(2)}</span>
          </div>`;
        lista.appendChild(item);
      });
    }
  </script>
</body>
</html>
