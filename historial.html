<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Historial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Historial de Ventas</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegacion -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold">
      <a href="index.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 rounded-lg bg-white shadow text-slate-900 font-bold">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Resumen Ventas Diarias y Mensuales -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-emerald-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-calendar-day"></i> Ventas Hoy
        </span>
        <h2 id="ventas-hoy" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p id="cant-ventas-hoy" class="text-[9px] text-gray-400">0 ventas</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-blue-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-calendar-days"></i> Ventas Mes
        </span>
        <h2 id="ventas-mes" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p id="cant-ventas-mes" class="text-[9px] text-gray-400">0 ventas</p>
      </div>
    </div>

    <!-- Meta Mensual y Grafica -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-indigo-500"></i> Meta Mensual (Supabase)
        </h3>
        <div class="flex items-center gap-1">
          <span class="text-[10px] text-gray-500 font-semibold">$</span>
          <input type="number" id="input-meta" placeholder="1500" class="w-16 border rounded-lg px-1.5 py-0.5 text-xs text-right outline-none focus:ring-1 focus:ring-indigo-500">
          <button onclick="guardarMeta()" class="bg-indigo-600 text-white px-2 py-0.5 rounded-lg text-[10px] font-bold hover:bg-indigo-700">
            Guardar
          </button>
        </div>
      </div>

      <div class="flex justify-between items-center text-xs pt-1">
        <span class="text-gray-500">Progreso del Mes:</span>
        <span id="porcentaje-meta" class="font-bold text-indigo-600">0%</span>
      </div>

      <div class="relative w-36 h-36 mx-auto pt-1">
        <canvas id="graficaMeta"></canvas>
      </div>
    </div>

    <!-- Top 3 Productos -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 flex items-center gap-1.5 border-b pb-2">
        <i class="fa-solid fa-trophy text-amber-500"></i> Top Productos Mas Vendidos
      </h3>
      <div id="top-productos" class="space-y-1.5 pt-1"></div>
    </div>

    <!-- Lista de Ventas con Filtros de Fecha -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-emerald-500"></i> Ventas
        </h2>
        
        <div class="flex gap-1 text-[10px] font-bold">
          <button onclick="filtrarRango('hoy')" id="btn-hoy" class="px-2 py-0.5 rounded-lg bg-emerald-600 text-white">Hoy</button>
          <button onclick="filtrarRango('semana')" id="btn-semana" class="px-2 py-0.5 rounded-lg bg-gray-200 text-gray-600">Semana</button>
          <button onclick="filtrarRango('mes')" id="btn-mes" class="px-2 py-0.5 rounded-lg bg-gray-200 text-gray-600">Mes</button>
          <button onclick="filtrarRango('todo')" id="btn-todo" class="px-2 py-0.5 rounded-lg bg-gray-200 text-gray-600">Todo</button>
        </div>
      </div>

      <div id="lista-historial" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let miGrafica = null;
    let metaActual = 1500;
    let filtroActual = 'hoy';

    async function obtenerMetaSupabase() {
      const db = window._supabase || window.supabase;
      if (!db) return 1500;

      try {
        const { data } = await db.from('configuracion').select('valor').eq('clave', 'meta_mensual').maybeSingle();
        if (data && data.valor) metaActual = Number(data.valor);
      } catch (err) {
        console.error('Error al obtener meta:', err);
      }
      return metaActual;
    }

    async function guardarMeta() {
      const db = window._supabase || window.supabase;
      const input = document.getElementById('input-meta');
      const nuevaMeta = parseFloat(input.value);

      if (isNaN(nuevaMeta) || nuevaMeta <= 0) {
        alert('Ingresa una meta valida.');
        return;
      }

      const { error } = await db.from('configuracion').upsert([{ clave: 'meta_mensual', valor: nuevaMeta }]);

      if (error) {
        alert('Error al guardar meta: ' + error.message);
        return;
      }

      alert('¡Meta guardada!');
      metaActual = nuevaMeta;
      renderHistorial();
    }

    function filtrarRango(rango) {
      filtroActual = rango;
      ['hoy', 'semana', 'mes', 'todo'].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        if (btn) {
          if (r === rango) {
            btn.className = 'px-2 py-0.5 rounded-lg bg-emerald-600 text-white font-bold';
          } else {
            btn.className = 'px-2 py-0.5 rounded-lg bg-gray-200 text-gray-600 font-bold';
          }
        }
      });
      renderHistorial();
    }

    async function renderHistorial() {
      const contenedor = document.getElementById('lista-historial');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      const listaVentas = window.ventas || [];
      await obtenerMetaSupabase();
      document.getElementById('input-meta').value = metaActual;

      const hoy = new Date();
      const inicioHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
      
      const inicioSemana = new Date(hoy);
      inicioSemana.setDate(hoy.getDate() - hoy.getDay());
      inicioSemana.setHours(0,0,0,0);

      let totalHoy = 0, cantHoy = 0;
      let totalMes = 0, cantMes = 0;

      const conteoProds = {};

      listaVentas.forEach(v => {
        const fechaV = new Date(v.fecha || v.created_at || 0);
        const monto = Number(v.total || v.ingreso || 0);

        if (fechaV >= inicioMes) { totalMes += monto; cantMes++; }
        if (fechaV >= inicioHoy) { totalHoy += monto; cantHoy++; }

        const prodNombre = v.producto || (v.detalles_productos && v.detalles_productos[0]?.nombre) || 'Producto Varios';
        const cant = v.cantidad || 1;

        if (!conteoProds[prodNombre]) conteoProds[prodNombre] = { cantidad: 0, total: 0 };
        conteoProds[prodNombre].cantidad += cant;
        conteoProds[prodNombre].total += monto;
      });

      renderTopProductos(conteoProds);

      const ventasFiltradas = listaVentas.filter(v => {
        const f = new Date(v.fecha || v.created_at || 0);
        if (filtroActual === 'hoy') return f >= inicioHoy;
        if (filtroActual === 'semana') return f >= inicioSemana;
        if (filtroActual === 'mes') return f >= inicioMes;
        return true;
      });

      const ordenadas = [...ventasFiltradas].sort((a, b) => new Date(b.fecha || b.created_at || 0) - new Date(a.fecha || a.created_at || 0));

      ordenadas.forEach(v => {
        const monto = Number(v.total || v.ingreso || 0);
        const item = document.createElement('div');
        item.className = 'p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs flex justify-between items-center shadow-sm';

        let fechaFormateada = 'Sin fecha';
        if (v.fecha || v.created_at) {
          const d = new Date(v.fecha || v.created_at);
          fechaFormateada = isNaN(d.getTime()) ? String(v.fecha) : d.toLocaleString();
        }

        const nombreProd = v.producto || (v.detalles_productos && v.detalles_productos[0]?.nombre) || 'Producto Varios';
        const cantidad = v.cantidad || 1;
        const ganancia = Number(v.gananciaNeta || v.ganancia_neta || v.gananciaBruta || 0).toFixed(2);
        const metodo = v.metodo_pago || 'Efectivo';

        item.innerHTML = `
          <div class="space-y-0.5">
            <p class="font-bold text-slate-800 text-xs">${nombreProd} <span class="text-emerald-600 font-semibold">(x${cantidad})</span></p>
            <p class="text-[10px] text-gray-400">${fechaFormateada} • <span class="text-slate-600 font-medium">${metodo}</span></p>
          </div>
          <div class="flex items-center gap-2">
            <div class="text-right">
              <p class="font-extrabold text-slate-900 text-sm">$${monto.toFixed(2)}</p>
              <p class="text-[9px] text-emerald-600 font-semibold">Ganancia: $${ganancia}</p>
            </div>
            <button onclick="eliminarVenta(${v.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded-lg border border-red-200 text-xs font-bold transition-colors" title="Borrar venta">
              <i class="fa-solid fa-trash text-xs"></i>
              <span>Borrar</span>
            </button>
          </div>
        `;
        contenedor.appendChild(item);
      });

      if (ordenadas.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">No hay ventas en este periodo.</p>';
      }

      document.getElementById('ventas-hoy').textContent = `$${totalHoy.toFixed(2)}`;
      document.getElementById('cant-ventas-hoy').textContent = `${cantHoy} venta${cantHoy === 1 ? '' : 's'}`;

      document.getElementById('ventas-mes').textContent = `$${totalMes.toFixed(2)}`;
      document.getElementById('cant-ventas-mes').textContent = `${cantMes} venta${cantMes === 1 ? '' : 's'}`;

      renderGraficaMeta(totalMes, metaActual);
    }

    function renderTopProductos(conteoObj) {
      const contenedor = document.getElementById('top-productos');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      const arreglo = Object.keys(conteoObj).map(key => ({
        nombre: key,
        cantidad: conteoObj[key].cantidad,
        total: conteoObj[key].total
      })).sort((a, b) => b.cantidad - a.cantidad).slice(0, 3);

      if (arreglo.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-1">Sin datos de productos.</p>';
        return;
      }

      arreglo.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center text-xs p-1.5 bg-gray-50 rounded-lg border';
        div.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="font-bold ${index === 0 ? 'text-amber-500' : 'text-gray-400'}">#${index + 1}</span>
            <span class="font-semibold text-slate-800 truncate">${item.nombre}</span>
          </div>
          <span class="font-extrabold text-emerald-600">${item.cantidad} u. ($${item.total.toFixed(2)})</span>
        `;
        contenedor.appendChild(div);
      });
    }

    function renderGraficaMeta(vendido, meta) {
      const porcentaje = Math.min(100, Math.round((vendido / meta) * 100)) || 0;
      document.getElementById('porcentaje-meta').textContent = `${porcentaje}% ($${vendido.toFixed(2)} / $${meta.toFixed(2)})`;

      const restante = Math.max(0, meta - vendido);
      const ctx = document.getElementById('graficaMeta').getContext('2d');

      if (miGrafica) {
        miGrafica.destroy();
      }

      miGrafica = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Alcanzado', 'Pendiente'],
          datasets: [{
            data: [vendido, restante],
            backgroundColor: ['#6366f1', '#e2e8f0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '75%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) { return ` $${context.raw.toFixed(2)}`; }
              }
            }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') {
        await cargarDatosGlobales();
      }
      renderHistorial();
    });
  </script>
</body>
</html>
