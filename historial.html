<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Historial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js para la gráfica de progreso -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Historial y Métricas</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold">
      <a href="index.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 rounded-lg bg-white shadow text-slate-900 font-bold">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Resumen Ventas Diarias y Mensuales -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-emerald-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-calendar-day"></i> Ventas Hoy
        </span>
        <h2 id="ventas-hoy" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p id="cant-ventas-hoy" class="text-[9px] text-gray-400">0 ventas registradas</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-blue-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-calendar-days"></i> Ventas Mes
        </span>
        <h2 id="ventas-mes" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p id="cant-ventas-mes" class="text-[9px] text-gray-400">0 ventas registradas</p>
      </div>
    </div>

    <!-- Meta Mensual y Gráfica -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-indigo-500"></i> Meta Mensual (Supabase)
        </h3>
        <!-- Ajustar Meta -->
        <div class="flex items-center gap-1">
          <span class="text-[10px] text-gray-500 font-semibold">$</span>
          <input type="number" id="input-meta" placeholder="1000" class="w-16 border rounded-lg px-1.5 py-0.5 text-xs text-right outline-none focus:ring-1 focus:ring-indigo-500">
          <button onclick="guardarMeta()" class="bg-indigo-600 text-white px-2 py-0.5 rounded-lg text-[10px] font-bold hover:bg-indigo-700">
            Guardar
          </button>
        </div>
      </div>

      <!-- Barra e Info de Progreso -->
      <div class="flex justify-between items-center text-xs pt-1">
        <span class="text-gray-500">Progreso del Mes:</span>
        <span id="porcentaje-meta" class="font-bold text-indigo-600">0%</span>
      </div>

      <!-- Gráfica de Dona -->
      <div class="relative w-36 h-36 mx-auto pt-1">
        <canvas id="graficaMeta"></canvas>
      </div>
    </div>

    <!-- Lista de Ventas Registradas -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-emerald-500"></i> Últimas Ventas
      </h2>

      <!-- Contenedor donde se cargan las ventas -->
      <div id="lista-historial" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let miGrafica = null;
    let metaActual = 1000;

    async function obtenerMetaSupabase() {
      const db = window._supabase || window.supabase;
      if (!db) return 1000;

      try {
        const { data, error } = await db
          .from('configuracion')
          .select('valor')
          .eq('clave', 'meta_mensual')
          .maybeSingle();

        if (data && data.valor) {
          metaActual = Number(data.valor);
        }
      } catch (err) {
        console.error('Error al obtener meta de Supabase:', err);
      }
      return metaActual;
    }

    async function guardarMeta() {
      const db = window._supabase || window.supabase;
      const input = document.getElementById('input-meta');
      const nuevaMeta = parseFloat(input.value);

      if (isNaN(nuevaMeta) || nuevaMeta <= 0) {
        alert('Por favor ingresa un monto válido para la meta.');
        return;
      }

      if (!db) {
        alert('Error: No hay conexión con Supabase');
        return;
      }

      const { error } = await db
        .from('configuracion')
        .upsert([{ clave: 'meta_mensual', valor: nuevaMeta }]);

      if (error) {
        alert('Error al guardar la meta en Supabase: ' + error.message);
        return;
      }

      alert('¡Meta mensual guardada exitosamente en la nube!');
      metaActual = nuevaMeta;
      renderHistorial();
    }

    async function renderHistorial() {
      const contenedor = document.getElementById('lista-historial');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      const listaVentas = window.ventas || [];
      await obtenerMetaSupabase();
      document.getElementById('input-meta').value = metaActual;

      const hoy = new Date();
      const inicioHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);

      let totalHoy = 0;
      let cantHoy = 0;
      let totalMes = 0;
      let cantMes = 0;

      const ordenadas = [...listaVentas].sort((a, b) => new Date(b.fecha || b.created_at || 0) - new Date(a.fecha || a.created_at || 0));

      ordenadas.forEach(v => {
        const fechaVenta = new Date(v.fecha || v.created_at || 0);
        const monto = Number(v.total || v.ingreso || 0);

        if (fechaVenta >= inicioMes) {
          totalMes += monto;
          cantMes++;
        }

        if (fechaVenta >= inicioHoy) {
          totalHoy += monto;
          cantHoy++;
        }

        const item = document.createElement('div');
        item.className = 'p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs flex justify-between items-center shadow-sm';

        let fechaFormateada = 'Sin fecha';
        if (v.fecha || v.created_at) {
          const d = new Date(v.fecha || v.created_at);
          fechaFormateada = isNaN(d.getTime()) ? String(v.fecha) : d.toLocaleString();
        }

        const nombreProd = v.producto || (v.detalles_productos && v.detalles_productos[0]?.nombre) || 'Producto Varios';
        const cantidad = v.cantidad || (v.detalles_productos && v.detalles_productos[0]?.cantidad) || 1;
        const ganancia = Number(v.gananciaNeta || v.ganancia_neta || v.gananciaBruta || 0).toFixed(2);

        item.innerHTML = `
          <div class="space-y-0.5">
            <p class="font-bold text-slate-800 text-xs">${nombreProd} <span class="text-emerald-600 font-semibold">(x${cantidad})</span></p>
            <p class="text-[10px] text-gray-400">${fechaFormateada}</p>
          </div>
          <div class="text-right">
            <p class="font-extrabold text-slate-900 text-sm">$${monto.toFixed(2)}</p>
            <p class="text-[9px] text-emerald-600 font-semibold">Ganancia: $${ganancia}</p>
          </div>
        `;
        contenedor.appendChild(item);
      });

      if (listaVentas.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">No hay ventas registradas aún.</p>';
      }

      document.getElementById('ventas-hoy').textContent = `$${totalHoy.toFixed(2)}`;
      document.getElementById('cant-ventas-hoy').textContent = `${cantHoy} venta${cantHoy === 1 ? '' : 's'}`;

      document.getElementById('ventas-mes').textContent = `$${totalMes.toFixed(2)}`;
      document.getElementById('cant-ventas-mes').textContent = `${cantMes} venta${cantMes === 1 ? '' : 's'}`;

      renderGraficaMeta(totalMes, metaActual);
    }

    function renderGraficaMeta(vendido, meta) {
      const porcentaje = Math.min(100, Math.round((vendido / meta) * 100)) || 0;
      document.getElementById('porcentaje-meta').textContent = `${porcentaje}% ($${vendido.toFixed(2)} / $${meta.toFixed(2)})`;

      const restante = Math.max(0, meta - vendido);
      const ctx = document.getElementById('graficaMeta').getContext('2d');

      if (miGrafica) {
        miGrafica.destroy();
      }

      miGrafica = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Alcanzado', 'Pendiente'],
          datasets: [{
            data: [vendido, restante],
            backgroundColor: ['#6366f1', '#e2e8f0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '75%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` $${context.raw.toFixed(2)}`;
                }
              }
            }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') {
        await cargarDatosGlobales();
      }
      renderHistorial();
    });
  </script>
</body>
</html>
