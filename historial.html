<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Historial de Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Historial de Transacciones</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold overflow-x-auto">
      <a href="index.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="caja.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cash-register"></i> Caja
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 px-2 rounded-lg bg-white shadow text-slate-900 font-bold whitespace-nowrap">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Tarjetas Superiores (Ventas Hoy / Ventas Mes) -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-1">
        <p class="text-[11px] font-bold text-emerald-600 flex items-center gap-1 uppercase tracking-wider">
          <i class="fa-regular fa-calendar-check"></i> Ventas Hoy
        </p>
        <p id="total-ventas-hoy" class="text-xl font-black text-slate-900">$0.00</p>
        <p id="cant-ventas-hoy" class="text-[11px] text-gray-400">0 ventas</p>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-1">
        <p class="text-[11px] font-bold text-blue-600 flex items-center gap-1 uppercase tracking-wider">
          <i class="fa-regular fa-calendar-days"></i> Ventas Mes
        </p>
        <p id="total-ventas-mes" class="text-xl font-black text-slate-900">$0.00</p>
        <p id="cant-ventas-mes" class="text-[11px] text-gray-400">0 ventas</p>
      </div>
    </div>

    <!-- Meta Mensual con Gráfico/Anillo de Progreso -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-indigo-500"></i> Meta Mensual (Supabase)
        </h3>
        <div class="flex items-center gap-1">
          <span class="text-xs text-gray-500">$</span>
          <input type="number" id="input-meta-mensual" value="1500" class="w-20 border rounded-lg p-1 text-xs font-semibold text-center outline-none focus:ring-1 focus:ring-indigo-500">
          <button onclick="guardarMetaMensual()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg">
            Guardar
          </button>
        </div>
      </div>

      <div class="flex justify-between items-center text-xs font-semibold">
        <span class="text-gray-600">Progreso del Mes:</span>
        <span id="texto-progreso-meta" class="text-indigo-600 font-bold">0% ($0.00 / $1500.00)</span>
      </div>

      <!-- Anillo Circular de Progreso -->
      <div class="flex justify-center py-2">
        <div class="relative w-32 h-32 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
            <path class="text-gray-200" stroke-width="3.8" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="circle-progress" class="text-indigo-600 transition-all duration-500 ease-out" stroke-dasharray="0, 100" stroke-width="3.8" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <span id="porcentaje-centro" class="absolute text-sm font-extrabold text-indigo-700">0%</span>
        </div>
      </div>
    </div>

    <!-- Lista de Últimas Ventas -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 border-b pb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-clock-rotate-left text-emerald-500"></i> Últimas Ventas
      </h3>
      <div id="lista-historial-ventas" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let metaMensualVal = parseFloat(localStorage.getItem('metaMensualPOS')) || 1500;

    function guardarMetaMensual() {
      const inputVal = parseFloat(document.getElementById('input-meta-mensual').value);
      if (inputVal && inputVal > 0) {
        metaMensualVal = inputVal;
        localStorage.setItem('metaMensualPOS', metaMensualVal);
        renderHistorial();
        alert('Meta mensual actualizada.');
      }
    }

    function renderHistorial() {
      const contenedor = document.getElementById('lista-historial-ventas');
      const ventas = window.ventas || [];

      document.getElementById('input-meta-mensual').value = metaMensualVal;

      const hoyStr = new Date().toISOString().split('T')[0];
      const mesActual = new Date().getMonth();
      const anioActual = new Date().getFullYear();

      let totalHoy = 0, cantHoy = 0;
      let totalMes = 0, cantMes = 0;

      ventas.forEach(v => {
        const fechaVenta = new Date(v.fecha || v.created_at || Date.now());
        const fechaStr = fechaVenta.toISOString().split('T')[0];
        const monto = Number(v.total || v.ingreso || 0);

        // Ventas de Hoy
        if (fechaStr === hoyStr) {
          totalHoy += monto;
          cantHoy++;
        }

        // Ventas del Mes
        if (fechaVenta.getMonth() === mesActual && fechaVenta.getFullYear() === anioActual) {
          totalMes += monto;
          cantMes++;
        }
      });

      // Actualizar tarjetas resumen
      document.getElementById('total-ventas-hoy').textContent = `$${totalHoy.toFixed(2)}`;
      document.getElementById('cant-ventas-hoy').textContent = `${cantHoy} ventas`;

      document.getElementById('total-ventas-mes').textContent = `$${totalMes.toFixed(2)}`;
      document.getElementById('cant-ventas-mes').textContent = `${cantMes} ventas`;

      // Calcular progreso de la Meta
      const pctMeta = Math.min(100, (totalMes / metaMensualVal) * 100);
      document.getElementById('texto-progreso-meta').textContent = `${pctMeta.toFixed(0)}% ($${totalMes.toFixed(2)} / $${metaMensualVal.toFixed(2)})`;
      document.getElementById('porcentaje-centro').textContent = `${pctMeta.toFixed(0)}%`;

      const circle = document.getElementById('circle-progress');
      if (circle) {
        circle.setAttribute('stroke-dasharray', `${pctMeta}, 100`);
      }

      // Renderizar Lista de Ventas
      if (!contenedor) return;
      if (ventas.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No hay ventas registradas aún.</p>';
        return;
      }

      contenedor.innerHTML = '';
      ventas.slice().reverse().forEach(v => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-gray-50 rounded-xl border flex justify-between items-center text-xs';
        const fecha = new Date(v.fecha || v.created_at || Date.now()).toLocaleString();
        const metodo = v.metodo_pago || 'Efectivo';

        item.innerHTML = `
          <div>
            <p class="font-bold text-slate-800">${v.producto || 'Producto'}</p>
            <p class="text-[10px] text-gray-500">Cant: ${v.cantidad || 1} u. | Método: <span class="font-semibold text-slate-700">${metodo}</span></p>
            <p class="text-[10px] text-gray-400">${fecha}</p>
          </div>
          <div class="text-right space-y-1">
            <p class="font-extrabold text-emerald-600 text-sm">$${Number(v.total || v.ingreso || 0).toFixed(2)}</p>
            <button onclick="eliminarVenta('${v.id}')" class="text-rose-600 hover:bg-rose-50 p-1 rounded text-[11px]">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        contenedor.appendChild(item);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') {
        await cargarDatosGlobales();
      }
      renderHistorial();
    });
  </script>
</body>
</html>
