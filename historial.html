<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Historial de Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Historial de Transacciones</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold overflow-x-auto">
      <a href="index.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="caja.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cash-register"></i> Caja
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 px-2 rounded-lg bg-white shadow text-slate-900 font-bold whitespace-nowrap">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Lista Historial -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 border-b pb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-receipt text-emerald-500"></i> Ventas Realizadas
      </h3>
      <div id="lista-historial-ventas" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function renderHistorialVentas() {
      const contenedor = document.getElementById('lista-historial-ventas');
      if (!contenedor) return;
      const ventas = window.ventas || [];

      if (ventas.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No se han registrado ventas.</p>';
        return;
      }

      contenedor.innerHTML = '';
      ventas.slice().reverse().forEach(v => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-gray-50 rounded-xl border space-y-1 text-xs';
        const fecha = new Date(v.fecha || v.created_at || Date.now()).toLocaleString();
        const metodo = v.metodo_pago || 'Efectivo';

        item.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold text-slate-900">${v.producto || 'Producto'}</p>
              <p class="text-[10px] text-gray-500">Cantidad: ${v.cantidad || 1} u. | Método: <span class="font-bold text-slate-700">${metodo}</span></p>
            </div>
            <span class="font-extrabold text-emerald-600 text-sm">$${Number(v.total || v.ingreso || 0).toFixed(2)}</span>
          </div>
          <div class="flex justify-between items-center text-[10px] text-gray-400 pt-1 border-t border-gray-200">
            <span>${fecha}</span>
            <span>Ganancia: $${Number(v.gananciaNeta || v.ganancia_neta || 0).toFixed(2)}</span>
          </div>
        `;
        contenedor.appendChild(item);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') await cargarDatosGlobales();
      renderHistorialVentas();
    });
  </script>
</body>
</html>
