<script>
    let productoSeleccionado = null;
    let cantidadSeleccionada = 1;

    function renderGridProductos() {
      const grid = document.getElementById('grid-productos') || document.getElementById('grid-productos-venta');
      if (!grid) return;
      grid.innerHTML = '';

      let lista = window.productos || [];

      const inputBusqueda = document.getElementById('input-buscar-producto');
      const termino = inputBusqueda ? inputBusqueda.value.trim().toLowerCase() : '';

      if (termino !== '') {
        lista = lista.filter(p => (p.nombre && p.nombre.toLowerCase().includes(termino)) || (p.producto && p.producto.toLowerCase().includes(termino)));
      }

      if (lista.length === 0) {
        grid.innerHTML = `<p class="col-span-2 text-xs text-gray-400 text-center py-4">
          ${termino !== '' ? `No se encontraron productos para "${termino}".` : 'No hay productos disponibles.'}
        </p>`;
        return;
      }

      lista.forEach(p => {
        const card = document.createElement('div');
        const esSeleccionado = productoSeleccionado && productoSeleccionado.id === p.id;
        const stock = p.stock !== null && p.stock !== undefined ? p.stock : 'N/A';
        const nombreProd = p.nombre || p.producto || 'Producto';

        let badgeStock = `<span class="text-[10px] text-gray-400">Stock: ${stock}</span>`;
        if (typeof stock === 'number' && stock <= 0) {
          badgeStock = `<span class="text-[9px] font-bold text-red-500 bg-red-50 px-1.5 py-0.5 rounded">Agotado</span>`;
        } else if (typeof stock === 'number' && stock <= 3) {
          badgeStock = `<span class="text-[9px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">Quedan ${stock}</span>`;
        }
        
        card.className = `p-2.5 rounded-xl border text-left cursor-pointer transition-all ${
          esSeleccionado ? 'border-emerald-500 bg-emerald-50 shadow-sm' : 'border-gray-200 bg-white hover:border-gray-300'
        }`;
        
        card.onclick = () => {
          seleccionarProducto(p);
        };

        card.innerHTML = `
          <p class="font-bold text-xs text-slate-800 truncate">${nombreProd}</p>
          <div class="flex justify-between items-end mt-1">
            <p class="text-emerald-600 font-extrabold text-xs">$${Number(p.precio || 0).toFixed(2)}</p>
            ${badgeStock}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function seleccionarProducto(p) {
      productoSeleccionado = p;
      cantidadSeleccionada = 1;
      const inputDesc = document.getElementById('input-descuento');
      if (inputDesc) inputDesc.value = '';
      actualizarResumenSeleccion();
      renderGridProductos();
    }

    function cambiarCantidad(delta) {
      if (!productoSeleccionado) return;
      const nuevoValor = cantidadSeleccionada + delta;
      if (nuevoValor >= 1) {
        cantidadSeleccionada = nuevoValor;
        actualizarResumenSeleccion();
      }
    }

    function actualizarResumenSeleccion() {
      const lblNombre = document.getElementById('label-producto-nombre');
      const lblCant = document.getElementById('label-cantidad');
      const lblTotal = document.getElementById('label-total');
      const inputDesc = document.getElementById('input-descuento');

      const descuentoVal = inputDesc ? Math.max(0, Number(inputDesc.value) || 0) : 0;

      if (productoSeleccionado) {
        lblNombre.textContent = productoSeleccionado.nombre || productoSeleccionado.producto;
        lblCant.textContent = cantidadSeleccionada;
        const subtotal = (Number(productoSeleccionado.precio) || 0) * cantidadSeleccionada;
        const total = Math.max(0, subtotal - descuentoVal);
        lblTotal.textContent = `$${total.toFixed(2)}`;
      } else {
        lblNombre.textContent = 'Ninguno';
        lblCant.textContent = '1';
        lblTotal.textContent = '$0.00';
      }
    }

    async function confirmarVenta() {
      if (!productoSeleccionado) {
        alert('Por favor selecciona un producto.');
        return;
      }

      const metodoPago = document.getElementById('select-metodo-pago').value;
      const inputDesc = document.getElementById('input-descuento');
      const descuento = inputDesc ? Math.max(0, Number(inputDesc.value) || 0) : 0;

      if (typeof registrarVenta === 'function') {
        await registrarVenta(productoSeleccionado, cantidadSeleccionada, metodoPago, descuento);
        productoSeleccionado = null;
        cantidadSeleccionada = 1;
        if (inputDesc) inputDesc.value = '';
        actualizarResumenSeleccion();
        renderGridProductos();
        actualizarMetricasUI();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') {
        await cargarDatosGlobales();
      }
      renderGridProductos();
    });
  </script>
