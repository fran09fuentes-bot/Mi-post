<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Vender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Punto de Venta</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Métricas del Día -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-emerald-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-chart-line"></i> Ganancia Neta
        </span>
        <h2 id="total-ganancia-neta" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Utilidad real</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border shadow-sm">
        <span class="text-[10px] font-bold text-blue-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-piggy-bank"></i> Reinversión
        </span>
        <h2 id="total-reinversion" class="text-lg font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Reposición de inventario</p>
      </div>
    </div>

    <!-- Resumen rápido -->
    <div class="bg-slate-900 text-white p-3 rounded-2xl flex justify-around text-center text-xs shadow-inner">
      <div>
        <p class="text-[10px] text-gray-400">Ventas Brutas</p>
        <p id="total-ventas-brutas" class="font-bold text-emerald-400">$0.00</p>
      </div>
      <div>
        <p class="text-[10px] text-gray-400">Gastos Fijos</p>
        <p id="total-gastos" class="font-bold text-rose-400">$0.00</p>
      </div>
      <div>
        <p class="text-[10px] text-gray-400">Ventas Reg.</p>
        <p id="cant-ventas" class="font-bold text-emerald-400">0</p>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold">
      <a href="index.html" class="flex-1 text-center py-2 rounded-lg bg-white shadow text-slate-900 font-bold">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="historial.html" class="flex-1 text-center py-2 rounded-lg text-gray-600">
        <i class="fa-solid fa-receipt"></i> Historial
      </a>
    </nav>

    <!-- Selección de Producto -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 border-b pb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-bolt text-amber-500"></i> Seleccionar Producto
      </h3>

      <!-- Grid del Catálogo con alertas de stock -->
      <div id="grid-productos" class="grid grid-cols-2 gap-2 max-h-52 overflow-y-auto pr-1"></div>

      <!-- Detalle y Método de Pago -->
      <div class="p-3 bg-gray-50 rounded-xl border space-y-2.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-500">Seleccionado:</span>
          <span id="label-producto-nombre" class="font-bold text-slate-900">Ninguno</span>
        </div>

        <!-- Selector de Método de Pago -->
        <div class="flex justify-between items-center text-xs pt-1 border-t">
          <span class="text-gray-500 font-medium">Método de Pago:</span>
          <select id="select-metodo-pago" class="border rounded-lg px-2 py-1 text-xs font-bold text-slate-800 outline-none bg-white">
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Transferencia">🏦 Transferencia</option>
            <option value="Tarjeta">💳 Tarjeta</option>
          </select>
        </div>

        <div class="flex justify-between items-center pt-2 border-t">
          <div class="flex items-center gap-2">
            <button onclick="cambiarCantidad(-1)" class="w-8 h-8 rounded-lg bg-gray-200 font-bold text-slate-700 active:scale-95 text-xs">-</button>
            <span id="label-cantidad" class="font-bold text-xs px-2">1</span>
            <button onclick="cambiarCantidad(1)" class="w-8 h-8 rounded-lg bg-gray-200 font-bold text-slate-700 active:scale-95 text-xs">+</button>
          </div>
          <div class="text-right">
            <p class="text-[10px] text-gray-400">Total</p>
            <p id="label-total" class="text-sm font-extrabold text-emerald-600">$0.00</p>
          </div>
        </div>
      </div>

      <button onclick="confirmarVenta()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-2.5 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-check"></i> Registrar Venta
      </button>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let productoSeleccionado = null;
    let cantidadSeleccionada = 1;

    function renderGridProductos() {
      const grid = document.getElementById('grid-productos');
      if (!grid) return;
      grid.innerHTML = '';

      const lista = window.productos || [];

      if (lista.length === 0) {
        grid.innerHTML = '<p class="col-span-2 text-xs text-gray-400 text-center py-4">No hay productos disponibles.</p>';
        return;
      }

      lista.forEach(p => {
        const card = document.createElement('div');
        const esSeleccionado = productoSeleccionado && productoSeleccionado.id === p.id;
        const stock = p.stock ?? 0;

        let badgeStock = `<span class="text-[10px] text-gray-400">Stock: ${stock}</span>`;
        if (stock <= 0) {
          badgeStock = `<span class="text-[9px] font-bold text-red-500 bg-red-50 px-1.5 py-0.5 rounded">Agotado</span>`;
        } else if (stock <= 3) {
          badgeStock = `<span class="text-[9px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">¡Quedan ${stock}!</span>`;
        }
        
        card.className = `p-2.5 rounded-xl border text-left cursor-pointer transition-all ${
          esSeleccionado ? 'border-emerald-500 bg-emerald-50 shadow-sm' : 'border-gray-200 bg-white hover:border-gray-300'
        } ${stock <= 0 ? 'opacity-60' : ''}`;
        
        card.onclick = () => {
          if (stock <= 0) {
            alert('Este producto se encuentra agotado.');
            return;
          }
          seleccionarProducto(p);
        };

        card.innerHTML = `
          <div class="flex justify-between items-start gap-1">
            <p class="font-bold text-xs text-slate-800 truncate">${p.nombre}</p>
          </div>
          <div class="flex justify-between items-end mt-1">
            <p class="text-emerald-600 font-extrabold text-xs">$${Number(p.precio || 0).toFixed(2)}</p>
            ${badgeStock}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function seleccionarProducto(p) {
      productoSeleccionado = p;
      cantidadSeleccionada = 1;
      actualizarResumenSeleccion();
      renderGridProductos();
    }

    function cambiarCantidad(delta) {
      if (!productoSeleccionado) return;
      const nuevoValor = cantidadSeleccionada + delta;
      if (nuevoValor >= 1 && (productoSeleccionado.stock === null || nuevoValor <= productoSeleccionado.stock)) {
        cantidadSeleccionada = nuevoValor;
        actualizarResumenSeleccion();
      } else if (nuevoValor > productoSeleccionado.stock) {
        alert(`Alcanzaste el límite de stock disponible (${productoSeleccionado.stock} u.)`);
      }
    }

    function actualizarResumenSeleccion() {
      const lblNombre = document.getElementById('label-producto-nombre');
      const lblCant = document.getElementById('label-cantidad');
      const lblTotal = document.getElementById('label-total');

      if (productoSeleccionado) {
        lblNombre.textContent = productoSeleccionado.nombre;
        lblCant.textContent = cantidadSeleccionada;
        const total = (Number(productoSeleccionado.precio) || 0) * cantidadSeleccionada;
        lblTotal.textContent = `$${total.toFixed(2)}`;
      } else {
        lblNombre.textContent = 'Ninguno';
        lblCant.textContent = '1';
        lblTotal.textContent = '$0.00';
      }
    }

    async function confirmarVenta() {
      if (!productoSeleccionado) {
        alert('Por favor selecciona un producto para realizar la venta.');
        return;
      }

      const metodoPago = document.getElementById('select-metodo-pago').value;

      if (typeof registrarVenta === 'function') {
        await registrarVenta(productoSeleccionado, cantidadSeleccionada, metodoPago);
        productoSeleccionado = null;
        cantidadSeleccionada = 1;
        actualizarResumenSeleccion();
        renderGridProductos();
        actualizarMetricasUI();
      }
    }

    function actualizarMetricasUI() {
      const vts = window.ventas || [];
      const gsts = window.gastos || [];

      let totalBruto = 0;
      let totalNeta = 0;
      let totalReinversion = 0;

      vts.forEach(v => {
        totalBruto += Number(v.total || v.ingreso || 0);
        totalNeta += Number(v.gananciaNeta || v.ganancia_neta || v.gananciaBruta || 0);
        totalReinversion += Number(v.reinversion || 0);
      });

      let totalGastos = 0;
      gsts.forEach(g => {
        totalGastos += Number(g.monto || g.precio || 0);
      });

      document.getElementById('total-ventas-brutas').textContent = `$${totalBruto.toFixed(2)}`;
      document.getElementById('total-ganancia-neta').textContent = `$${(totalNeta - totalGastos).toFixed(2)}`;
      document.getElementById('total-reinversion').textContent = `$${totalReinversion.toFixed(2)}`;
      document.getElementById('total-gastos').textContent = `$${totalGastos.toFixed(2)}`;
      document.getElementById('cant-ventas').textContent = vts.length;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof cargarDatosGlobales === 'function') {
        await cargarDatosGlobales();
      }
      renderGridProductos();
      actualizarMetricasUI();
    });
  </script>
</body>
</html>
