<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS Negocio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [vista, setVista] = useState('gastos'); // 'vender', 'productos', 'gastos', 'historial', 'reportes'
      const [gastos, setGastos] = useState([]);
      const [ventas, setVentas] = useState([]);

      const [concepto, setConcepto] = useState('');
      const [monto, setMonto] = useState('');
      const [tipoGasto, setTipoGasto] = useState('OPERATIVO');

      // Cargar datos guardados en el navegador
      useEffect(() => {
        const gastosGuardados = localStorage.getItem('mi_pos_gastos');
        if (gastosGuardados) setGastos(JSON.parse(gastosGuardados));

        const ventasGuardadas = localStorage.getItem('mi_pos_ventas');
        if (ventasGuardadas) setVentas(JSON.parse(ventasGuardadas));
      }, []);

      // Agregar Gasto o Reinversión
      const handleAgregarGasto = (e) => {
        e.preventDefault();
        if (!concepto || !monto || parseFloat(monto) <= 0) return;

        const hoy = new Date();
        const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;

        const nuevoGasto = {
          id: Date.now(),
          concepto: `${concepto} (${fechaStr})`,
          monto: parseFloat(monto),
          tipo: tipoGasto
        };

        const nuevaLista = [nuevoGasto, ...gastos];
        setGastos(nuevaLista);
        localStorage.setItem('mi_pos_gastos', JSON.stringify(nuevaLista));

        setConcepto('');
        setMonto('');
        setTipoGasto('OPERATIVO');
      };

      // 🗑️ ELIMINAR GASTO
      const handleEliminarGasto = (idGasto, conceptoGasto) => {
        if (window.confirm(`¿Quieres borrar "${conceptoGasto}"?`)) {
          const listaFiltrada = gastos.filter(item => item.id !== idGasto);
          setGastos(listaFiltrada);
          localStorage.setItem('mi_pos_gastos', JSON.stringify(listaFiltrada));
        }
      };

      // Cálculos
      const totalVentasBrutas = ventas.reduce((acc, v) => acc + Number(v.total || v.monto || 0), 0);
      
      const totalGastosFijos = gastos
        .filter(g => g.tipo === 'OPERATIVO' || !g.tipo)
        .reduce((acc, g) => acc + Number(g.monto), 0);

      const totalReinversion = gastos
        .filter(g => g.tipo === 'REINVERSION')
        .reduce((acc, g) => acc + Number(g.monto), 0);

      const gananciaNeta = totalVentasBrutas - totalGastosFijos;

      return (
        <div className="pb-10">
          {/* BARRA SUPERIOR */}
          <header className="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center mb-6">
            <div>
              <h1 className="text-xl font-bold flex items-center gap-2">🏪 Mi POS Negocio</h1>
              <p className="text-xs text-slate-400">Sistema Integral de Gestión</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => localStorage.clear() && location.reload()} className="bg-red-600 text-xs px-3 py-1.5 rounded-lg font-bold">Limpia Todo</button>
            </div>
          </header>

          <main className="max-w-xl mx-auto px-4 space-y-4">
            {/* RESUMEN DE GANANCIA Y REINVERSIÓN */}
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <span className="text-[11px] font-bold text-emerald-600 uppercase">📈 GANANCIA NETA</span>
                <div className={`text-2xl font-extrabold ${gananciaNeta < 0 ? 'text-red-500' : 'text-slate-800'}`}>
                  ${gananciaNeta.toFixed(2)}
                </div>
                <p className="text-[10px] text-slate-400">Utilidad real (menos gastos)</p>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <span className="text-[11px] font-bold text-blue-600 uppercase">📦 REINVERSIÓN</span>
                <div className="text-2xl font-extrabold text-slate-800">${totalReinversion.toFixed(2)}</div>
                <p className="text-[10px] text-slate-400">Fondo reposición (No tocar)</p>
              </div>
            </div>

            {/* MÉTRICAS SECUNDARIAS */}
            <div className="bg-slate-900 text-white p-3 rounded-xl flex justify-between text-center text-xs">
              <div>
                <p className="text-slate-400">Ventas Brutas</p>
                <p className="font-bold text-sm">${totalVentasBrutas.toFixed(2)}</p>
              </div>
              <div>
                <p className="text-slate-400">Gastos Fijos</p>
                <p className="font-bold text-sm text-red-400">${totalGastosFijos.toFixed(2)}</p>
              </div>
              <div>
                <p className="text-slate-400">Ventas Reg.</p>
                <p className="font-bold text-sm text-emerald-400">{ventas.length}</p>
              </div>
            </div>

            {/* NAVEGACIÓN */}
            <div className="flex justify-around bg-slate-200 p-1 rounded-xl text-xs font-bold">
              <button onClick={() => setVista('vender')} className={`py-2 px-3 rounded-lg ${vista === 'vender' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`}>🛒 Vender</button>
              <button onClick={() => setVista('productos')} className={`py-2 px-3 rounded-lg ${vista === 'productos' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`}>🛞 Productos</button>
              <button onClick={() => setVista('gastos')} className={`py-2 px-3 rounded-lg ${vista === 'gastos' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`}>💳 Gastos</button>
              <button onClick={() => setVista('historial')} className={`py-2 px-3 rounded-lg ${vista === 'historial' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`}>📜 Historial</button>
            </div>

            {/* PESTAÑA GASTOS */}
            {vista === 'gastos' && (
              <div className="space-y-4">
                <div className="bg-white p-5 rounded-xl border border-slate-100 shadow-sm">
                  <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wide mb-3">REGISTRAR GASTO FIJO / OPERATIVO</h3>
                  
                  <form onSubmit={handleAgregarGasto} className="space-y-3">
                    <div className="flex gap-2 p-1 bg-slate-100 rounded-lg text-xs">
                      <button type="button" className={`flex-1 py-1.5 font-bold rounded-md ${tipoGasto === 'OPERATIVO' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`} onClick={() => setTipoGasto('OPERATIVO')}>Gasto Operativo</button>
                      <button type="button" className={`flex-1 py-1.5 font-bold rounded-md ${tipoGasto === 'REINVERSION' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500'}`} onClick={() => setTipoGasto('REINVERSION')}>Reinversión</button>
                    </div>

                    <input type="text" placeholder="Concepto (ej. Alquiler, Internet, Publicidad)" value={concepto} onChange={(e) => setConcepto(e.target.value)} className="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none" required />
                    <input type="number" step="0.01" placeholder="Monto ($)" value={monto} onChange={(e) => setMonto(e.target.value)} className="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none" required />
                    <button type="submit" className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg text-sm shadow-sm">Registrar Gasto</button>
                  </form>
                </div>

                <div className="bg-white p-5 rounded-xl border border-slate-100 shadow-sm">
                  <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wide mb-3">LISTA DE GASTOS</h3>
                  {gastos.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-2">No hay gastos registrados.</p>
                  ) : (
                    <div className="space-y-2">
                      {gastos.map((item) => (
                        <div key={item.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg border border-slate-100 text-xs">
                          <div>
                            <p className="font-medium text-slate-700">{item.concepto}</p>
                            <span className={`inline-block text-[9px] font-bold px-1.5 py-0.5 rounded mt-0.5 ${item.tipo === 'REINVERSION' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                              {item.tipo === 'REINVERSION' ? 'Reinversión' : 'Gasto Operativo'}
                            </span>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="font-bold text-red-500">-${Number(item.monto).toFixed(2)}</span>
                            {/* 🗑️ BOTÓN DE ELIMINAR */}
                            <button onClick={() => handleEliminarGasto(item.id, item.concepto)} className="p-1 text-red-500 hover:bg-red-50 rounded font-bold" title="Eliminar gasto" type="button">🗑️ Borrar</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
