<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi POS - Vender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js para la gráfica de días de venta -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> Mi POS Negocio
      </h1>
      <p class="text-xs text-gray-400">Punto de Venta</p>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Cuadrícula de 4 Tarjetas de Métricas -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-white p-3 rounded-2xl border shadow-sm space-y-0.5">
        <span class="text-[10px] font-bold text-emerald-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-dollar-sign"></i> Ventas Hoy
        </span>
        <h2 id="total-ventas-hoy" class="text-base font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Ingreso del dia</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border shadow-sm space-y-0.5">
        <span class="text-[10px] font-bold text-indigo-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-chart-line"></i> Ganancia Neta
        </span>
        <h2 id="total-ganancia-neta" class="text-base font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Utilidad real</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border shadow-sm space-y-0.5">
        <span class="text-[10px] font-bold text-blue-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-piggy-bank"></i> Reinversion
        </span>
        <h2 id="total-reinversion" class="text-base font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Reposicion stock</p>
      </div>

      <div class="bg-white p-3 rounded-2xl border shadow-sm space-y-0.5">
        <span class="text-[10px] font-bold text-amber-600 uppercase flex items-center gap-1">
          <i class="fa-solid fa-money-bill-wave"></i> Caja Efectivo
        </span>
        <h2 id="total-efectivo-caja" class="text-base font-extrabold text-slate-800">$0.00</h2>
        <p class="text-[9px] text-gray-400">Efectivo fisico</p>
      </div>
    </div>

    <!-- Barra de resumen rápida -->
    <div class="bg-slate-900 text-white p-3 rounded-2xl flex justify-around text-center text-xs shadow-inner">
      <div>
        <p class="text-[10px] text-gray-400">Ventas Acum.</p>
        <p id="total-ventas-brutas" class="font-bold text-emerald-400">$0.00</p>
      </div>
      <div>
        <p class="text-[10px] text-gray-400">Gastos Fijos</p>
        <p id="total-gastos" class="font-bold text-rose-400">$0.00</p>
      </div>
      <div>
        <p class="text-[10px] text-gray-400">Ventas Reg.</p>
        <p id="cant-ventas" class="font-bold text-emerald-400">0</p>
      </div>
    </div>

    <!-- Navegación Original -->
    <nav class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-semibold overflow-x-auto">
      <a href="index.html" class="flex-1 text-center py-2 px-2 rounded-lg bg-white shadow text-slate-900 font-bold whitespace-nowrap">
        <i class="fa-solid fa-cart-plus"></i> Vender
      </a>
      <a href="inventario.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked"></i> Productos
      </a>
      <a href="gastos.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-wallet"></i> Gastos
      </a>
      <a href="caja.html" class="flex-1 text-center py-2 px-2 rounded-lg text-gray-600 whitespace-nowrap">
        <i class="fa-solid fa-cash-register"></i> Caja
      </a>
      <a href="historial.html" class="flex-
